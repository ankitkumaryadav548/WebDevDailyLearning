<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dark{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <h1 id="heading">Indroduction of DOM</h1>
    <p id="para">Welcome to DOM</p>

      <!-- Dynamic styling and content updated -->
       <button onclick="toggle()">Toggle Mode</button>

       <!-- event -->
        <button id="btn">Click Me</button>
    <script>
        function toggle (){
            document.body.classList.toggle("dark")

        }

        document.getElementById("btn").addEventListener("click",()=>
    {
        alert("Hello Ankit")
    })
        //DOM
        console.log(document)
        console.log(document.body)

        //DOM traversal
        let t = document.getElementById("heading")
        console.log(t.parentNode)
        console.log(t.nextElementSibling)
        console.log(document.body.children)

        //DOM Manipulation
        let element = document.getElementById("para")
        para.textContent = "DOM is updated or text is changed"
        para.style.color = "red"
        //create element
        let newelement =  document.createElement("p")
        newelement.textContent = "Hello dear , this is new para"
        document.body.appendChild(newelement)
        newelement.style.color = "green" 
        
      
        

    </script>
</body>
</html>
